<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScamShield Bharat</title>
<style>
  :root { --bg:#f6f7f4; --ink:#1c2420; --muted:#5d6a63; --card:#fff; --line:#dfe4de; --accent:#1f6f4a;
          --high:#b3261e; --warn:#a65f00; --ok:#1f6f4a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121815; --ink:#e8eee9; --muted:#9aa89f; --card:#1a221e; --line:#2c3730; --accent:#2f8a5f;
            --high:#ff8a80; --warn:#ffb74d; --ok:#5ec08f; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, "Noto Sans Tamil", "Noto Sans Devanagari", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  textarea { width:100%; min-height:140px; padding:12px; border:1px solid var(--line); border-radius:10px;
             background:var(--card); color:var(--ink); font:inherit; resize:vertical; }
  .row { display:flex; gap:10px; margin-top:10px; }
  select, button { font:inherit; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button { background:var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer; flex:1; }
  button:disabled { opacity:.6; }
  #out { margin-top:20px; display:none; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .badge { display:inline-block; padding:3px 10px; border-radius:99px; font-weight:700; font-size:.85rem; border:1.5px solid currentColor; }
  .high { color:var(--high); } .suspicious { color:var(--warn); } .likely_safe { color:var(--ok); }
  .meter { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin:12px 0; }
  .meter > div { height:100%; background:currentColor; }
  #out p, #out li, #out strong { color: var(--ink); }
  ul { padding-left: 20px; } small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>ScamShield Bharat</h1>
  <p class="sub">Paste a suspicious SMS or WhatsApp message. Get a verdict and a clear reason.</p>
  <textarea id="msg" placeholder="Paste the message here..."></textarea>
  <div class="row">
    <select id="lang" aria-label="Language">
      <option value="en">English</option><option value="ta">தமிழ்</option><option value="hi">हिन्दी</option>
    </select>
    <button id="go">Check message</button>
  </div>
  <div id="out" aria-live="polite"></div>
</main>
<script>
const LABELS = {
  en:{high:"Likely scam",suspicious:"Suspicious",likely_safe:"Looks safe",what:"What to do",src:"Report or learn more"},
  ta:{high:"மோசடியாக இருக்கலாம்",suspicious:"சந்தேகத்திற்குரியது",likely_safe:"பாதுகாப்பாகத் தெரிகிறது",what:"என்ன செய்வது",src:"புகார் / மேலும் அறிய"},
  hi:{high:"धोखाधड़ी की संभावना",suspicious:"संदिग्ध",likely_safe:"सुरक्षित लगता है",what:"क्या करें",src:"शिकायत / और जानें"}
};
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go'), out = document.getElementById('out');
  const message = document.getElementById('msg').value.trim(), lang = document.getElementById('lang').value;
  if (message.length < 3) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/check', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message, lang})});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(), L = LABELS[lang];
    out.style.display = 'block';
    out.innerHTML = `<div class="${d.level}"><span class="badge">${L[d.level]}</span> <small>${Math.round(d.score*100)}%</small>
      <div class="meter"><div style="width:${d.score*100}%"></div></div></div>
      <p>${esc(d.explanation)}</p>
      ${d.steps.length ? `<strong>${L.what}</strong><ul>${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>` : ''}
      <small>${L.src}: ${d.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(' · ')}</small>`;
  } catch (e) { out.style.display='block'; out.textContent = 'Could not check the message. Please try again.'; }
  btn.disabled = false;
};
</script>
</body>
</html>
